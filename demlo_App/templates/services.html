{% extends "base.html" %}
{% block title %}Услуги{% endblock %}
{% block main_content %}
    <h2>Наши услуги</h2>
    <ul>
        {% for service in services %}
            <li>{{ service.name }} — {{ service.price }} руб.</li>
        {% empty %}
            <li>Услуги пока не добавлены.</li>
        {% endfor %}
    </ul>
    <p><a href="{% url 'request-form' %}">Оставить заявку</a></p>
{% endblock %}
